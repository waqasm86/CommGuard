[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commguard"
version = "0.2.0"
description = "Content-agnostic workload signal research SDK for Kaggle dual-T4 systems"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "CommGuard contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/waqasm86/CommGuard"
Repository = "https://github.com/waqasm86/CommGuard.git"
Issues = "https://github.com/waqasm86/CommGuard/issues"

[project.optional-dependencies]
analysis = [
  "numpy>=2.0",
  "pandas>=2.3",
  "scikit-learn>=1.6",
]
telemetry = ["nvidia-ml-py>=13"]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.9",
  "mypy>=1.13",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
commguard = "commguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA-capable GPU",
  "multigpu: requires exactly two CUDA GPUs and NCCL",
  "network: requires network access",
  "slow: long-running integration test",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
exclude = ["notebooks/"]
